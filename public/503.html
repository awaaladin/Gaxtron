<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>503 — Gaxtron</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#080c12" />
  <link rel="stylesheet" href="/css/errors.css?v=1" />
</head>
<body class="error-page">
  <div class="error-wrap">
    <a href="/" class="error-brand">
      <div class="error-brand-mark">GX</div>
      <span>Gaxtron</span>
    </a>
    <div class="error-card">
      <div class="error-code">503</div>
      <h1 class="error-title">Service unavailable</h1>
      <p class="error-message">Gaxtron is temporarily down for maintenance or recovering from high load. Please check back shortly.</p>
      <div class="error-actions">
        <button type="button" class="error-btn error-btn--primary" onclick="location.reload()">Retry</button>
        <a href="/" class="error-btn error-btn--ghost">Back home</a>
      </div>
    </div>
  </div>
</body>
</html>
