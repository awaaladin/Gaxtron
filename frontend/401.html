<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>401 — Gaxtron</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#080c12" />
  <link rel="stylesheet" href="/css/errors.css?v=1" />
</head>
<body class="error-page">
  <div class="error-wrap">
    <a href="/" class="error-brand">
      <div class="error-brand-mark">GX</div>
      <span>Gaxtron</span>
    </a>
    <div class="error-card">
      <div class="error-code">401</div>
      <h1 class="error-title">Authentication required</h1>
      <p class="error-message">Sign in to continue. Your session may have expired.</p>
      <div class="error-actions">
        <a href="/login.html" class="error-btn error-btn--primary">Sign in</a>
        <a href="/register.html" class="error-btn error-btn--ghost">Create account</a>
      </div>
    </div>
  </div>
</body>
</html>
