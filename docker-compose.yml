services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gaxtron
      POSTGRES_PASSWORD: gaxtron_secret
      POSTGRES_DB: gaxtron_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaxtron -d gaxtron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot schema init/migration (Postgres). Existing FastAPI-era tables (users, payments,
  # api_keys, ...) are reconciled with `--fake-initial` — see DEPLOY.md.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: python manage.py migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gaxtron:gaxtron_secret@postgres:5432/gaxtron_db
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      postgres:
        condition: service_healthy

  # Django — serves the site, the REST API, and the hosted checkout page, all on one port.
  web:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: python manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gaxtron:gaxtron_secret@postgres:5432/gaxtron_db
      REDIS_URL: redis://redis:6379/0
      ENV: development
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 15s
      timeout: 10s
      retries: 5

  web-prod:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gaxtron:gaxtron_secret@postgres:5432/gaxtron_db
      REDIS_URL: redis://redis:6379/0
      ENV: production
      DEBUG: "False"
      REQUIRE_HTTPS_CALLBACKS: "True"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Blockchain listener — polls pending payments for confirmations and delivers webhooks.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: python manage.py run_listener
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gaxtron:gaxtron_secret@postgres:5432/gaxtron_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
