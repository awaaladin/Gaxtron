{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Gaxtron</title>
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<meta name="theme-color" content="#0A0A08">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="{% static 'js/tailwind-config.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body class="flex min-h-screen flex-col bg-background font-body text-foreground antialiased">
<header class="flex h-16 items-center border-b border-border px-margin-mobile md:px-margin-desktop">
  <a href="/" class="font-display text-base font-bold tracking-tight text-primary">GAXTRON</a>
  <span class="label-caps ml-4 text-[10px] text-muted-foreground">System error</span>
</header>
<main class="flex flex-1 items-center justify-center px-margin-mobile text-center">
  <div class="max-w-lg">
    <p class="font-display text-[140px] italic leading-none text-foreground">404</p>
    <h1 class="mt-stack-md font-display text-2xl text-foreground">Page not found</h1>
    <p class="mt-stack-sm text-sm text-muted-foreground">The page you're looking for doesn't exist or may have been moved.</p>
    <div class="mt-stack-lg flex justify-center gap-stack-md">
      <a href="/" class="btn-primary px-8 py-3">Return home</a>
      <a href="/dashboard/" class="btn-ghost px-8 py-3">Dashboard</a>
    </div>
    <p class="label-caps mt-stack-lg text-[10px] text-outline">ERR_GAX_04_NULL_REF_GATEWAY · <span id="liveClock">—</span></p>
  </div>
</main>
<script>
  const clock = document.getElementById('liveClock');
  function tick() { clock.textContent = new Date().toISOString(); }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
