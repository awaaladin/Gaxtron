{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 | Gaxtron</title>
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<meta name="theme-color" content="#0A0A08">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/tailwind-built.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body class="flex min-h-screen flex-col bg-background font-body text-foreground antialiased">
<header class="flex h-16 items-center border-b border-border px-margin-mobile md:px-margin-desktop">
  <a href="/" class="font-display text-base font-bold tracking-tight text-primary">GAXTRON</a>
  <span class="label-caps ml-4 text-[10px] text-muted-foreground">Access forbidden</span>
</header>
<main class="relative flex flex-1 items-center justify-center overflow-hidden px-margin-mobile text-center">
  <span class="pointer-events-none absolute select-none font-display text-[420px] leading-none text-foreground opacity-[0.03]" aria-hidden="true">403</span>
  <div class="relative z-10 max-w-lg">
    <p class="font-display text-[140px] italic leading-none text-foreground">403</p>
    <h1 class="mt-stack-md font-display text-2xl text-foreground">Access denied</h1>
    <p class="mt-stack-sm text-sm text-muted-foreground">You don't have permission to view this resource. Sign in with the right account or contact your admin.</p>
    <div class="mt-stack-lg flex justify-center gap-stack-md">
      <a href="/login/" class="btn-primary px-8 py-3">Sign in</a>
      <a href="/" class="btn-ghost px-8 py-3">Back home</a>
    </div>
    <p class="label-caps mt-stack-lg text-[10px] text-outline">NODE_ID: GX-9921-SEC</p>
  </div>
</main>
</body>
</html>
