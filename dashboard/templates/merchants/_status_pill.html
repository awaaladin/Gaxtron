{% if status == 'confirmed' or status == 'delivered' %}<span class="label-caps rounded-full border px-3 py-1 text-[9px] border-primary/40 text-primary">Confirmed</span>
{% elif status == 'pending' %}<span class="label-caps rounded-full border px-3 py-1 text-[9px] border-border text-muted-foreground">Pending</span>
{% else %}<span class="label-caps rounded-full border px-3 py-1 text-[9px] border-destructive/40 text-destructive">{{ status|title }}</span>
{% endif %}
