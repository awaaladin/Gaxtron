<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="UTF-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>500 | Gaxtron</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<meta name="theme-color" content="#0B0B0A"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&family=Geist:wght@400;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/base.css"/>
</head>
<body class="bg-background text-on-surface font-body-md flex flex-col min-h-screen">
<header class="px-margin-mobile md:px-margin-desktop h-16 flex items-center border-b border-outline-variant">
  <a href="/" class="font-headline-md text-[16px] font-bold text-primary tracking-tighter">GAXTRON</a>
  <span class="font-label-caps text-[10px] text-error uppercase tracking-widest ml-4">Internal Server Exception</span>
</header>
<main class="flex-1 flex items-center justify-center px-margin-mobile text-center">
  <div class="max-w-lg">
    <p class="font-display-lg text-[140px] leading-none text-error italic">500</p>
    <h1 class="font-headline-md text-headline-md text-on-surface mt-stack-md">Something went wrong</h1>
    <p class="font-body-md text-on-surface-variant mt-stack-sm">We hit an unexpected error on our side. The team has been notified — try again in a moment.</p>
    <div class="flex justify-center gap-stack-md mt-stack-lg">
      <a href="/dashboard/" class="bg-primary text-on-primary font-label-caps text-label-caps py-3 px-8 tracking-widest hover:bg-primary-container transition-colors">RETURN TO DASHBOARD</a>
      <button type="button" onclick="location.reload()" class="border border-outline-variant text-on-surface font-label-caps text-label-caps py-3 px-8 tracking-widest hover:bg-surface-container-low transition-colors">RETRY CONNECTION</button>
    </div>
    <p class="font-label-caps text-[10px] text-outline uppercase tracking-widest mt-stack-lg">STATUS: CRITICAL</p>
  </div>
</main>
</body>
</html>
