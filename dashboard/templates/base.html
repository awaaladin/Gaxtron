{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <meta name="theme-color" content="#0A0A08">
  <title>{% block title %}Gaxtron{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tailwind-built.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-foreground font-body antialiased selection:bg-primary selection:text-primary-foreground">
{% block body %}{% endblock %}
{% block extra_scripts %}{% endblock %}
<script>if (window.lucide) { lucide.createIcons(); }</script>
</body>
</html>
